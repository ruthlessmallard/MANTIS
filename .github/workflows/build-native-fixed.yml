name: Build MANTIS (Native Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # Even older Ubuntu with compatible autotools
    timeout-minutes: 120
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Setup Java 8 (compatible with older Android builds)
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '8'
        
    - name: Install older autotools versions
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf=2.69-11.1 \
          automake=1:1.16.1-4ubuntu6 \
          libtool=2.4.6-14 \
          pkg-config \
          build-essential \
          git \
          unzip \
          openjdk-8-jdk
        sudo apt-mark hold autoconf automake libtool
        
    - name: Verify autotools versions
      run: |
        autoconf --version
        automake --version
        libtool --version
        
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-ubuntu20-${{ hashFiles('buildozer.spec') }}
        
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.4.0 cython==0.29.33
        
    - name: Create minimal buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = MANTIS
        package.name = mantis
        package.domain = com.miningtech
        source.dir = .
        source.include_exts = py
        version = 2.7.1
        requirements = python3,kivy==2.0.0
        orientation = portrait
        
        android.permissions = 
        android.api = 30
        android.minapi = 21
        android.archs = arm64-v8a
        android.ndk = 21e
        android.accept_sdk_license = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF
        
    - name: Build APK
      run: |
        buildozer android debug --verbose 2>&1 | tee build-native.log
        
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mantis-native-${{ github.sha }}
        path: |
          **/*.apk
          build-native.log
          .buildozer/
        retention-days: 30