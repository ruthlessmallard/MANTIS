name: Build MANTIS with Docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly fallback build

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Build APK with Docker
      run: |
        docker run --rm -v "$PWD":/home/user/app kivy/buildozer:latest \
          bash -c "cd /home/user/app && buildozer android debug"
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: mantis-apk-docker-${{ github.sha }}
        path: "**/*.apk"
        retention-days: 30