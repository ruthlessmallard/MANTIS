name: Build MANTIS Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-11-jdk \
          python3-pip \
          build-essential \
          git \
          unzip \
          libffi-dev \
          libssl-dev \
          libbz2-dev \
          libsqlite3-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libreadline-dev \
          libgdbm-dev \
          libdb5.3-dev \
          liblzma-dev \
          tk-dev \
          zip \
          autoconf \
          automake \
          libtool \
          cmake
          
    - name: Set JAVA_HOME
      run: echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
        
    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
        
    - name: Initialize Buildozer (download Android SDK/NDK)
      run: |
        buildozer android debug || echo "First run may fail, continuing..."
        
    - name: Accept all Android SDK licenses
      run: |
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || \
        yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || \
        echo "License acceptance completed or not needed"
        
    - name: Build APK (second attempt)
      run: |
        buildozer android debug
        
    - name: List built files
      run: |
        find . -name "*.apk" -type f
        ls -la bin/ || echo "No bin directory found"
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: mantis-apk-${{ github.sha }}
        path: "**/*.apk"
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: "**/*.apk"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}